<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>meetingnotes</title>
<style>
:root{--bg:#202938;--panel:#384252;--inset:#202938;--line:#4d586a;--text:#f3f4f6;--muted:#9ca3af;--blue:#2563eb;--blue-hi:#3b82f6;--act:#f0abfc;--info:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:min(94vw,80rem);margin:0 auto;padding:2rem 16px 4rem;display:grid;gap:1rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.25rem}
h1,h2{margin:0;font-size:1rem;font-weight:600}
.sub{margin:.25rem 0 0;color:var(--muted);font-size:.9rem}
/* drop zone */
#drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;margin-top:1rem;min-height:11rem;
 background:var(--inset);border:1px dashed var(--line);border-radius:8px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
#drop:hover,#drop.over{border-color:var(--blue-hi);background:#232d3e}
#drop .chip{position:absolute;top:0;left:0;padding:.3rem .7rem;font-size:.8rem;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:8px 0 8px 0}
#drop svg{width:28px;height:28px;margin-bottom:.35rem}
#drop .hint{color:var(--muted);font-size:.9rem}
#drop.has .hint{display:none}
#file{display:none}
/* buttons */
button,.btn{display:block;width:100%;padding:.8rem;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:600;color:var(--text);
 text-align:center;text-decoration:none;cursor:pointer;background:#4a5568;transition:background .15s}
button:hover,.btn:hover{background:#556074}
#go{margin-top:1rem;border-color:var(--blue);background:var(--blue)}
#go:hover{background:var(--blue-hi)}
button:disabled{opacity:.55;cursor:wait}
#cancel{margin-top:.6rem}
[hidden]{display:none!important}
.bar{height:2px;margin-top:.9rem;border-radius:2px;overflow:hidden;display:none}
.bar.on{display:block;background:linear-gradient(90deg,transparent,var(--blue-hi),transparent);background-size:200% 100%;animation:s 1.2s linear infinite}
@keyframes s{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.bar.on{animation:none}}
/* status notice */
.note{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;padding:.65rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--inset);font-size:.9rem}
.note::before{content:"";flex:none;width:.55rem;height:.55rem;border-radius:50%;background:var(--blue-hi)}
.note.ok::before{background:#4ade80}
.note.cancelled{border-color:#7a6a3a}.note.cancelled::before{background:#fbbf24}
.note.error{border-color:#7f3a3a}.note.error::before{background:#f87171}
/* results */
#results{display:none}
#results.on{display:grid;gap:1rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:1rem}
.col{min-width:0}
.col>h3{margin:0 0 .6rem;font-size:.95rem;font-weight:600}
.col.act>h3{color:var(--act)}.col.info>h3{color:var(--info)}
.box{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:.35rem .9rem}
.card{padding:.75rem 0;border-bottom:1px solid var(--line);contain:layout paint style;content-visibility:auto;contain-intrinsic-size:auto 9rem}
.card:last-child{border-bottom:0}
.card h4{margin:0 0 .35rem;font-size:.95rem}
.card p{margin:0}.card ul{margin:0;padding-left:1.15rem}.card li{margin:.2rem 0}.card ul ul{margin:.1rem 0}
.empty{margin:.75rem 0;color:var(--muted);font-style:italic}
.dls{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1rem}
@media(max-width:700px){.cols,.dls{grid-template-columns:1fr}}
</style></head><body><main>
<form id="f" class="panel">
 <h1>Audio Mode</h1><p class="sub">Upload a recording to get a summary and a downloadable transcript.</p>
 <label id="drop" for="file">
  <span class="chip">Recording or audio file</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
  <strong id="name">Drop Audio Here</strong>
  <span class="hint">- or -</span>
  <span class="hint" style="color:var(--text)">Click to Upload</span>
 </label>
 <input id="file" type="file" name="file" accept="audio/*,video/*" required>
 <button id="go">Analyze Meeting</button>
 <button type="button" id="cancel" hidden>Cancel</button>
 <div class="bar" id="bar"></div><div id="status" class="note" role="status" hidden></div>
</form>
<div id="results">
 <section class="panel">
  <h2>Meeting Analysis</h2>
  <div class="cols">
   <div class="col act"><h3>Action-oriented sections</h3><div class="box" id="act"></div></div>
   <div class="col info"><h3>Information-oriented sections</h3><div class="box" id="info"></div></div>
  </div>
  <div class="dls">
   <a class="btn" id="dlsum" download="summary.md">Download summary</a>
   <a class="btn" id="dl" download="transcript.txt">Download transcript</a>
  </div>
 </section>
</div>
</main>
<script>
const $=id=>document.getElementById(id),file=$("file"),drop=$("drop");
const say=(text,kind="")=>{const n=$("status");n.textContent=text;n.className="note "+kind;n.hidden=!text};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
// summary headings that belong in the action column; everything else goes to information
const ACTION=/summary|action|next step|decision|follow/i;

function body(lines){ // tiny markdown: paragraphs, nested "- " bullets
 let html="",depth=-1;
 for(const raw of lines){
  const m=raw.match(/^(\s*)[-*]\s+(.*)/);
  if(m){const d=Math.floor(m[1].length/2);
   while(depth<d){html+="<ul>";depth++}
   while(depth>d){html+="</ul>";depth--}
   html+="<li>"+inline(m[2])+"</li>";
  }else if(raw.trim()){while(depth>=0){html+="</ul>";depth--}html+="<p>"+inline(raw.trim())+"</p>"}
 }
 while(depth>=0){html+="</ul>";depth--}
 return html;
}
function sections(md){ // [{title, lines}] split on "## " headings
 const out=[];let cur=null;
 for(const line of md.split(/\r?\n/)){
  const h=line.match(/^#{1,3}\s+(.*)/);
  if(h){if(/^meeting summary$/i.test(h[1].trim()))continue;cur={title:h[1].trim(),lines:[]};out.push(cur)}
  else if(cur)cur.lines.push(line);
 }
 return out;
}
function render(d,fname){
 const a=[],i=[];
 for(const s of sections(d.summary)){
  const html=`<div class="card"><h4>${esc(s.title)}</h4>${body(s.lines)}</div>`;
  (ACTION.test(s.title)?a:i).push(html);
 }
 $("act").innerHTML=a.join("")||'<p class="empty">Nothing here for this meeting.</p>';
 $("info").innerHTML=i.join("")||'<p class="empty">Nothing here for this meeting.</p>';
 const base=(fname||"meeting").replace(/\.[^.]+$/,"");
 const link=(id,text,type,name)=>{$(id).href=URL.createObjectURL(new Blob([text.trim()+"\n"],{type}));$(id).download=name};
 link("dlsum",d.summary,"text/markdown",base+"-summary.md"); // one file, both columns
 link("dl",d.transcript,"text/plain",base+"-transcript.txt");
 $("results").classList.add("on");
}

const show=()=>{const f=file.files[0];$("name").textContent=f?f.name:"Drop Audio Here";drop.classList.toggle("has",!!f)};
file.onchange=show;
["dragover","dragenter"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{file.files=e.dataTransfer.files;show()});
let ctl;
$("cancel").onclick=()=>ctl?.abort();
$("f").onsubmit=async e=>{e.preventDefault();ctl=new AbortController();
 $("go").disabled=true;$("cancel").hidden=false;$("bar").classList.add("on");say("Processing…");
 $("results").classList.remove("on");
 try{const r=await fetch("/process",{method:"POST",body:new FormData($("f")),signal:ctl.signal});
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  if(d.cancelled)say("Request cancelled.","cancelled");
  else{render(d,file.files[0]?.name);say("Done.","ok")}}
 catch(err){err.name==="AbortError"?say("Request cancelled.","cancelled"):say("Error: "+err.message,"error")}
 $("go").disabled=false;$("cancel").hidden=true;$("bar").classList.remove("on")};
</script></body></html>
