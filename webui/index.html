<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>meetingnotes</title>
<style>
:root{--glass:rgba(255,255,255,.14);--edge:rgba(255,255,255,.28);--text:#f4f6ff;--muted:rgba(244,246,255,.7);--accent:#8ab4ff;--act:#ff8fc0;--info:#7ee0d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.55 system-ui,sans-serif;color:var(--text);
 background:#101326}
/* gradient lives on its own fixed layer: the browser composites it instead of repainting it on every scroll frame */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;will-change:transform;
 background:radial-gradient(circle at 15% 20%,#5b4bff 0,transparent 45%),radial-gradient(circle at 85% 15%,#ff5fa2 0,transparent 40%),
 radial-gradient(circle at 70% 90%,#1fd1c1 0,transparent 45%)}
main{max-width:min(96vw,90rem);margin:0 auto;padding:2.5rem 16px 4rem;display:grid;gap:1.25rem}
/* no backdrop-filter: re-blurring what is behind every card on each scroll frame was the main cost, so the glass look is a tinted translucent fill */
.glass{background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.06)),rgba(16,19,38,.42);border:1px solid var(--edge);border-radius:20px;padding:1.5rem;
 box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.25)}
h1{margin:0 0 .25rem;font-size:1.9rem}p{margin:0;color:var(--muted)}
#drop{display:block;margin-top:1.25rem;padding:2rem 1rem;text-align:center;border:2px dashed var(--edge);border-radius:16px;cursor:pointer;transition:.2s}
#drop:hover,#drop.over{background:rgba(255,255,255,.12);border-color:var(--accent)}
#file{display:none}
button,.btn{display:block;width:100%;margin-top:1rem;padding:.85rem;border:1px solid var(--edge);border-radius:14px;font:inherit;font-weight:600;
 color:#fff;text-align:center;text-decoration:none;cursor:pointer;background:linear-gradient(135deg,rgba(138,180,255,.55),rgba(255,95,162,.45))}
button:disabled{opacity:.5;cursor:wait}
#cancel{background:rgba(255,255,255,.1)}#cancel:hover{background:rgba(255,95,95,.35)}
[hidden]{display:none!important}
.note{display:flex;align-items:center;gap:.6rem;margin-top:1rem;padding:.7rem 1rem;border-radius:12px;border:1px solid var(--edge);
 background:rgba(255,255,255,.1);color:var(--text);font-size:.95rem}
.note::before{content:"";flex:none;width:.6rem;height:.6rem;border-radius:50%;background:var(--accent)}
.note.ok::before{background:var(--info)}
.note.cancelled{border-color:rgba(255,200,120,.55);background:rgba(255,190,100,.14)}.note.cancelled::before{background:#ffc878}
.note.error{border-color:rgba(255,120,120,.6);background:rgba(255,90,90,.16)}.note.error::before{background:#ff7a7a}
.bar{height:3px;margin-top:.75rem;border-radius:3px;overflow:hidden;display:none}
.bar.on{display:block;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:s 1.2s linear infinite}
@keyframes s{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.bar.on{animation:none}}
#results{display:none}
#results.on{display:grid;gap:1.25rem}
.cols{display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden}
.col{padding:1.5rem;min-width:0}
.col+.col{border-left:1px solid var(--edge)}
.col>h2{margin:0 0 1rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.col.act>h2{color:var(--act)}.col.info>h2{color:var(--info)}
.card{background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.85rem;
 contain:layout paint style;content-visibility:auto;contain-intrinsic-size:auto 11rem}  /* off-screen cards are skipped until scrolled near */
.card:last-child{margin-bottom:0}
.card h3{margin:0 0 .5rem;font-size:1rem}
.act .card{border-left:3px solid var(--act)}.info .card{border-left:3px solid var(--info)}
.card p{color:var(--text)}.card ul{margin:0;padding-left:1.15rem}.card li{margin:.25rem 0}.card ul ul{margin:.15rem 0}
.empty{color:var(--muted);font-style:italic}
.dls{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.dls .btn{margin:0}
@media(max-width:700px){.cols,.dls{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--edge)}}
</style></head><body><main>
<form id="f" class="glass">
 <h1>meetingnotes</h1><p>Upload a recording to get a summary and a downloadable transcript.</p>
 <label id="drop" for="file"><span id="name">Drop an audio file here or click to browse</span></label>
 <input id="file" type="file" name="file" accept="audio/*,video/*" required>
 <button id="go">Transcribe &amp; summarize</button>
 <button type="button" id="cancel" hidden>Cancel</button>
 <div class="bar" id="bar"></div><div id="status" class="note" role="status" hidden></div>
</form>
<div id="results">
 <div class="glass cols">
  <section class="col act"><h2>Action-oriented</h2><div id="act"></div></section>
  <section class="col info"><h2>Information</h2><div id="info"></div></section>
 </div>
 <div class="dls">
  <a class="btn" id="dlsum" download="summary.md">Download summary</a>
  <a class="btn" id="dl" download="transcript.txt">Download transcript</a>
 </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id),file=$("file"),drop=$("drop");
const say=(text,kind="")=>{const n=$("status");n.textContent=text;n.className="note "+kind;n.hidden=!text};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
// summary headings that belong in the action column; everything else goes to information
const ACTION=/summary|action|next step|decision|follow/i;

function body(lines){ // tiny markdown: paragraphs, nested "- " bullets
 let html="",depth=-1;
 for(const raw of lines){
  const m=raw.match(/^(\s*)[-*]\s+(.*)/);
  if(m){const d=Math.floor(m[1].length/2);
   while(depth<d){html+="<ul>";depth++}
   while(depth>d){html+="</ul>";depth--}
   html+="<li>"+inline(m[2])+"</li>";
  }else if(raw.trim()){while(depth>=0){html+="</ul>";depth--}html+="<p>"+inline(raw.trim())+"</p>"}
 }
 while(depth>=0){html+="</ul>";depth--}
 return html;
}
function sections(md){ // [{title, lines}] split on "## " headings
 const out=[];let cur=null;
 for(const line of md.split(/\r?\n/)){
  const h=line.match(/^#{1,3}\s+(.*)/);
  if(h){if(/^meeting summary$/i.test(h[1].trim()))continue;cur={title:h[1].trim(),lines:[]};out.push(cur)}
  else if(cur)cur.lines.push(line);
 }
 return out;
}
function render(d,fname){
 const a=[],i=[];
 for(const s of sections(d.summary)){
  const html=`<div class="card"><h3>${esc(s.title)}</h3>${body(s.lines)}</div>`;
  (ACTION.test(s.title)?a:i).push(html);
 }
 $("act").innerHTML=a.join("")||'<p class="empty">Nothing here for this meeting.</p>';
 $("info").innerHTML=i.join("")||'<p class="empty">Nothing here for this meeting.</p>';
 const base=(fname||"meeting").replace(/\.[^.]+$/,"");
 const link=(id,text,type,name)=>{$(id).href=URL.createObjectURL(new Blob([text.trim()+"\n"],{type}));$(id).download=name};
 link("dlsum",d.summary,"text/markdown",base+"-summary.md"); // one file, both columns
 link("dl",d.transcript,"text/plain",base+"-transcript.txt");
 $("results").classList.add("on");
}

const show=()=>{$("name").textContent=file.files[0]?.name||"Drop an audio file here or click to browse"};
file.onchange=show;
["dragover","dragenter"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{file.files=e.dataTransfer.files;show()});
let ctl;
$("cancel").onclick=()=>ctl?.abort();
$("f").onsubmit=async e=>{e.preventDefault();ctl=new AbortController();
 $("go").disabled=true;$("cancel").hidden=false;$("bar").classList.add("on");say("Processing…");
 $("results").classList.remove("on");
 try{const r=await fetch("/process",{method:"POST",body:new FormData($("f")),signal:ctl.signal});
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();
  if(d.cancelled)say("Request cancelled.","cancelled");
  else{render(d,file.files[0]?.name);say("Done.","ok")}}
 catch(err){err.name==="AbortError"?say("Request cancelled.","cancelled"):say("Error: "+err.message,"error")}
 $("go").disabled=false;$("cancel").hidden=true;$("bar").classList.remove("on")};
</script></body></html>
